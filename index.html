<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SILLY PAGE</title>
        <link rel="stylesheet" type="text/css" href="./index.css">
        
</head>

<body>

    <div id="id">
    <!-- top thingy -->
    <div class="up" style="display: flex; justify-content: space-between">
        <p style="color: black;"> SillyOS </p>
        <div class="imagestop">
            <img src="koro sensei (1).png" alt="">
        </div>
        <p id="timeElement" style="color: black;">  </p>
    </div>
    
    <!-- hi thingy -->
    <div id="hi">
        <p style="cursor: pointer" id="hiclose" class="closebutton">Close</p>
    <div  id="hiheader"> SILLY OS </div>
    <p> Be silly!</p>
    <p> WELCOME TO SILLYOS! </p>
    <p> This is a web where there's a bit of me everywhere so... enjoy my silly world! </p>
    <a draggable="false" href="https://open.spotify.com/playlist/37i9dQZF1EIYyZyB8mXFN1?si=E4CKqvyPSUuNcOgRPGL6Qg">FAV PLAYLSIST (YES, I LOVE ADO)</a>
    </div>

    <div id="hiopen"> 
        <div style="text-align: center; padding: 16px; width: fit-content"></div>
        <p style="cursor: pointer" ><img src="lucky cat.gif" alt=""></p> 
        <p style="margin-left: 1.3%;"> Hi!</p>
    </div>

    <!-- notes -->

    <div id="writeopen">
        <div class="crow" style="text-align: center; padding: 16px; width: fit-content"> </div>
      <p style="cursor: pointer;"><img src="crow.gif" style="width: 60px; height: 60px; border-radius: 16px;"></p>
    <p> Silly Notes </p>
    </div>

    <div id="write">
    <div id="notes">
        <p style="cursor: pointer" id="writeclose" class="closebutton2">Close</p>
    <h1 id="writeheader"> Silly Notes</h1>
    <div class="container">
    <textarea name="text" id="text" placeholder="Be silly here..."></textarea>
    <div>
    <div id="button">
        <button style="border: solid #9f42f0;" id="save"> Save </button>
    </div>
    </div>
    <div id="list"></div>
    </div>
    </div>
    </div>

    <!--Drawing-->
    <div id="drawopen">
        <div class="cat" style="text-align: center; padding: 16px; width: fit-content"> </div>
      <p style="cursor: pointer;"><img src="https://media.tenor.com/Pj1z6_WvKdwAAAAi/maxwell-cat-maxwell.gif" style="width: 60px; height: 60px; border-radius: 16px;"></p>
    <p> Draw! </p>
    </div>
    <div id="drawthingy">
         <p style="cursor: pointer" id="drawclose" class="closebutton3"> Close </p>
    <div id="tools"> 
        <h1 id="drawheader"> Draw your thoughts! </h1>
        <input type="color" id="pickcolor" value="#000000">
        <input type="range" id="brushsize" min="1" max="50" value="5">
        <button id="clean"> Clean </button>
        <button id="fill"> Fill </button>
    </div>
    <canvas id="board" height="380" width="440"></canvas>
    </div>

    <!--MUSIC-->
    <div id="murkrow">
        <p style="cursor: pointer;">
    <img src="https://media.tenor.com/kaUYpfT89-MAAAAi/murkrow-pokemon.gif" style="width: 60px; height: 60px; border-radius: 16px;"></p>
    <p> Music! </p>
    </div>
    <div id="musicthingy">
        <p style="cursor: pointer" id="musicclose" class="closebutton4"> Close </p>
    <div id="favlist">  
       <img id="cover" src="./gifs/ado-licking.gif" alt="" style="width: 140px; height: 100%; border-radius: 10px;">
        <h1 id="Title"> Song</h1>
        <h2 id="Artist"> Artist </h2>
        <div class="controls">
            <button id="back"> ⏮</button>
            <button id="pause"> ⏸ </button>
            <button id="next"> ⏭ </button>
            <div>
            <div class="progressbar" id="progressbar">
                <div class="progress" id="progress"> </div>
            </div>


                <div class="volume" id="volume">
                    <img src="volume.png" alt="" style="height: 100%; width: 30px;">
                    <input type="range" min="0" max="100" value="50"> 
                    <div class="icon">
                        <i class="volume-up" aria-hidden="true"></i>
                    </div>
                    <div class="bar-box">
                        <div class="bar">
                            <div class="bar-fill"></div>
                        </div>
                    </div>
            </div>


        </div>
    </div>
    </div>

    </div>

    <script src="./index.js"> </script>

</body>

</html>
